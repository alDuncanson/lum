# Publishes prebuilt binaries, so installing lum does not require Nix or a
# Rust toolchain. Both binaries are self-contained — ONNX Runtime is statically
# linked and TLS is rustls — so a release archive is two files and nothing else.
#
# Deliberately does NOT build with Nix, even though the flake is the source of
# truth for development. A binary built inside `nix develop` links libraries
# from /nix/store and will not start on a machine that has no Nix; the point of
# a release is to run anywhere.
#
# Native runners for every target rather than cross-compilation: the ONNX
# Runtime build script fetches per-target artifacts, and cross-linking that is
# a much worse trade than parallel jobs.
#
# Linux builds on 24.04, not 22.04. Choosing the older runner to widen distro
# support was wrong twice over: the prebuilt ONNX Runtime `ort` downloads is
# itself compiled against glibc 2.38+, so linking on 22.04 (glibc 2.35) fails
# outright on `__isoc23_strtoull`, and even if it linked, the vendored library
# — not the runner — sets the floor.
#
# There is no Intel macOS target: `ort` publishes no prebuilt ONNX Runtime for
# x86_64-apple-darwin, so that build fails at the dependency, not here.
# Supporting it means compiling ONNX Runtime from source or pointing
# ORT_LIB_LOCATION at a local copy.
#
# Every step below is `scripts/build-release.sh`, so this path can be run on a
# laptop instead of only on a tag.
#
# Trigger with a tag (`git tag v0.1.0 && git push --tags`) or from the Actions
# tab, which builds without publishing so the pipeline can be exercised on a
# private repository.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (a dry run: builds and uploads artifacts, publishes nothing)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          # The version is stamped into the binary and the archive name, so a
          # malformed one produces a release nobody can resolve.
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must be x.y.z, got '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the version matches the tree
        run: |
          # flake.nix is the source of truth. A tag that disagrees with it
          # would ship a binary whose `lum version` is a lie.
          declared=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' flake.nix | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "flake.nix declares $declared, release wants ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: dispatcher/go.mod
          cache-dependency-path: dispatcher/go.sum

      - name: Install Rust
        run: |
          # Pinned to the flake's toolchain so a release is built with what
          # development is tested with. rustup ships on every runner.
          toolchain=$(grep -oE 'rust-bin\.stable\."[0-9.]+"' flake.nix | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
          key: ${{ matrix.target }}

      - name: Build, verify, smoke test, and package
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: lum-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    # Only a tag publishes. workflow_dispatch stops after build, so the
    # pipeline can be exercised without cutting a release.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "lum $version" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo '')" \
            dist/*
