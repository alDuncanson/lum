# Publishes prebuilt binaries, so installing lum does not require Nix or a
# Rust toolchain. Both binaries are self-contained — ONNX Runtime is statically
# linked and TLS is rustls — so a release archive is two files and nothing else.
#
# Deliberately does NOT build with Nix, even though the flake is the source of
# truth for development. A binary built inside `nix develop` links libraries
# from /nix/store and will not start on a machine that has no Nix; the point of
# a release is to run anywhere.
#
# Native runners for every target rather than cross-compilation: the ONNX
# Runtime build script fetches per-target artifacts, and cross-linking that is
# a much worse trade than four parallel jobs.
#
# Linux builds on 22.04 rather than 24.04 on purpose — glibc is
# backward-compatible but not forward-compatible, so the oldest runner sets the
# oldest distro a release will start on.
#
# Trigger with a tag (`git tag v0.1.0 && git push --tags`) or from the Actions
# tab, which builds without publishing so the pipeline can be exercised on a
# private repository.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (a dry run: builds and uploads artifacts, publishes nothing)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          # The version is stamped into the binary and the archive name, so a
          # malformed one produces a release nobody can resolve.
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must be x.y.z, got '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the version matches the tree
        run: |
          # flake.nix is the source of truth. A tag that disagrees with it
          # would ship a binary whose `lum version` is a lie.
          declared=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' flake.nix | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "flake.nix declares $declared, release wants ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: dispatcher/go.mod
          cache-dependency-path: dispatcher/go.sum

      - name: Install Rust
        run: |
          # Pinned to the flake's toolchain so a release is built with what
          # development is tested with. rustup ships on every runner.
          toolchain=$(grep -oE 'rust-bin\.stable\."[0-9.]+"' flake.nix | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
          key: ${{ matrix.target }}

      - name: Build the worker
        working-directory: worker
        run: cargo build --release --locked

      - name: Build the dispatcher
        working-directory: dispatcher
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/alDuncanson/lum/dispatcher/internal/version.Value=${{ steps.version.outputs.version }}" \
            -o lum ./cmd/lum

      - name: Check the binaries are self-contained
        run: |
          # The failure this guards against is silent: a binary that links
          # something only the build machine has starts fine in CI and not on
          # anyone else's computer.
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            for bin in dispatcher/lum worker/target/release/lum-worker; do
              echo "== $bin"; otool -L "$bin"
              if otool -L "$bin" | grep -vE '^\S|/usr/lib/|/System/Library/'; then
                echo "$bin links something outside the system libraries" >&2; exit 1
              fi
            done
          else
            for bin in dispatcher/lum worker/target/release/lum-worker; do
              echo "== $bin"; ldd "$bin" || true
              if ldd "$bin" | grep -qiE 'libssl|libcrypto|onnxruntime'; then
                echo "$bin expects a shared library a user may not have" >&2; exit 1
              fi
            done
          fi

      - name: Smoke test
        run: |
          # Proves the pair actually runs, and that the dispatcher finds its
          # worker as a sibling — which is what the install instructions rely
          # on. No network: an empty directory has nothing to embed, so no
          # model is fetched.
          set -e
          mkdir -p stage empty
          cp dispatcher/lum worker/target/release/lum-worker stage/
          test "$(./stage/lum version)" = "${{ steps.version.outputs.version }}"
          export LUM_DATA_DIR="$PWD/smoke" LUM_HTTP_ADDR=127.0.0.1:7431
          ./stage/lum serve &
          for _ in $(seq 1 100); do
            ./stage/lum status >/dev/null 2>&1 && break
            sleep 0.3
          done
          ./stage/lum status
          ./stage/lum stop

      - name: Package
        id: package
        run: |
          name="lum-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp dispatcher/lum worker/target/release/lum-worker "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    # Only a tag publishes. workflow_dispatch stops after build, so the
    # pipeline can be exercised without cutting a release.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "lum $version" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo '')" \
            dist/*
