# Builds and tests both binaries plus the Neovim plugin, on Linux and macOS,
# through `nix flake check` — the same command used locally, so a green run
# here means the same thing as a green run on a laptop.
#
# Paused for a while during the pivot to repository semantic search, because
# waiting on an ONNX Runtime build for every exploratory commit is a slow
# signal. Back on now that the repository is public: a stranger reading a
# broken main branch has no way to know it is broken on purpose.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
