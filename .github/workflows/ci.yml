# CI is paused while the repository-semantic-search direction is still being
# built out: `nix flake check` builds the dispatcher and the worker plus the
# ONNX runtime on two runners, which is a slow signal to wait on for
# exploratory commits.
#
# The job below is unchanged and still runnable by hand from the Actions tab
# (or `gh workflow run ci.yml`). To resume automatic runs, restore:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
# Run the same checks locally in the meantime: `nix flake check`.

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
