// worker.proto — the contract between the dispatcher and the worker.
//
// This file is the single source of truth for how the dispatcher (lumd)
// talks to the worker (lum-worker). Both sides generate code
// from it:
//
//   - Go:   `buf generate` inside `nix develop` runs the Go plugins and
//           commits the output to dispatcher/internal/gen/.
//   - Rust: worker/build.rs compiles it at build time with protox
//           (a pure-Rust protobuf compiler — no protoc install needed).
//
// Design notes:
//
//   - The dispatcher owns all *orchestration* state: which sources
//     exist, which documents they contain, content hashes, chunk counts.
//     The worker is intentionally stateless between calls — every
//     request carries everything the worker needs. This keeps the
//     worker restartable at any time without coordination.
//
//   - Chunk identity: when a document is ingested, the worker splits
//     it into N chunks and stores one vector point per chunk, with a
//     point ID derived deterministically from (document_id, chunk_index).
//     Re-ingesting the same document_id overwrites those points in
//     place. Deletion (re-ingest of a shrunk document, or an explicit
//     DeleteDocument) removes every point for a document_id via a
//     payload-indexed filtered delete in the vector store, not by
//     counting — the dispatcher no longer needs to track or echo
//     back a chunk count for this to work.
//
// Versioning: the `lum.v1` package name is the API version. Breaking
// changes mean a new `lum.v2` package, never edits that change the
// meaning of existing fields.

syntax = "proto3";

package lum.v1;

option go_package = "github.com/alDuncanson/lum/dispatcher/internal/gen/lum/v1;lumv1";

// Worker is the ingestion + retrieval engine.
//
// It is deliberately a *narrow* interface (five RPCs). New source types,
// schedulers, watchers, etc. live entirely in the dispatcher and reuse
// these same RPCs — adding an RSS source requires zero changes here.
// New *file formats* live entirely in the worker behind its Parser
// trait — also zero changes here.
service Worker {
  // Health reports whether the worker is ready to serve requests.
  // "Ready" means the embedding model is loaded (downloaded on first
  // run) and the vector store is open. The dispatcher polls this
  // after spawning the worker process.
  rpc Health(HealthRequest) returns (HealthResponse);

  // IngestDocument runs the full pipeline for one document:
  // parse → chunk → embed → upsert vectors.
  //
  // Idempotent: re-ingesting the same document_id replaces its chunks.
  rpc IngestDocument(IngestDocumentRequest) returns (IngestDocumentResponse);

  // IngestBatch streams bounded content frames for multiple documents,
  // then embeds their chunks together. This avoids gRPC's per-message
  // size ceiling while making short documents efficient to ingest.
  rpc IngestBatch(stream IngestBatchRequest) returns (IngestBatchResponse);

  // DeleteDocument removes all vector points belonging to a document.
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Search embeds the query text and returns the nearest chunks.
  rpc Search(SearchRequest) returns (SearchResponse);
}

message HealthRequest {}

message HealthResponse {
  // True once the embedding model and vector store are initialized.
  bool ready = 1;
  // Human-readable detail, e.g. the embedding model name.
  string detail = 2;
  // Version of this gRPC contract implemented by the binary. The
  // dispatcher refuses to start if its expected version differs.
  string contract_version = 3;
  // Detailed lifecycle state. Older peers may leave this unspecified;
  // clients then fall back to ready.
  ReadinessState state = 4;
}

enum ReadinessState {
  READINESS_STATE_UNSPECIFIED = 0;
  READINESS_STATE_STARTING = 1;
  READINESS_STATE_DOWNLOADING_MODEL = 2;
  READINESS_STATE_READY = 3;
  READINESS_STATE_UNAVAILABLE = 4;
}

message IngestDocumentRequest {
  // Stable identifier for the document, assigned by the dispatcher
  // (a UUID). Chunk point IDs are derived from this, so it must not
  // change across re-ingests of the same logical document.
  string document_id = 1;
  // The source this document belongs to (dispatcher source UUID).
  // Stored in chunk payloads so results can be traced back.
  string source_id = 2;
  // Human-meaningful location, e.g. "/Users/al/Documents/notes.md" or,
  // later, an RSS item URL. Returned in search results.
  string uri = 3;
  // MIME type detected by the source (e.g. "text/markdown"). The data
  // plane picks a Parser implementation based on this.
  string mime_type = 4;
  // Raw document bytes. Parsing happens in the worker so that new
  // formats (PDF, HTML, ...) never require dispatcher changes.
  bytes content = 5;
  reserved 6; // previous_chunk_count, replaced by a filtered delete on document_id (#3)
  reserved "previous_chunk_count";
  // Short, human-meaningful label for the document, prepended to each
  // chunk before embedding but never stored in the payload. For local
  // directories this is the repository-relative path.
  //
  // People search with words that live in the path — "ingestion diagram",
  // "telescope plugin setup" — and the URI is not otherwise part of what
  // gets embedded, so those queries had nothing to match. The source
  // supplies it because only the source knows what a short label means for
  // its own URI space. Empty is allowed; the worker then derives one.
  string display_path = 7;
}

message IngestDocumentResponse {
  // Number of chunks stored. The dispatcher records this in its
  // catalog and echoes it back as previous_chunk_count next time.
  uint32 chunk_count = 1;
}

message IngestBatchRequest {
  oneof frame {
    IngestBatchDocumentHeader document = 1;
    // Frames are exactly 256 KiB except for the final frame, which is
    // the exact remaining content length.
    bytes content = 2;
    IngestBatchEndDocument end_document = 3;
  }
}

message IngestBatchDocumentHeader {
  string document_id = 1;
  string source_id = 2;
  string uri = 3;
  string mime_type = 4;
  reserved 5; // previous_chunk_count, replaced by a filtered delete on document_id (#3)
  reserved "previous_chunk_count";
  // Exact number of content bytes that follow. The server rejects
  // truncated or overlong streams before modifying the vector store.
  uint64 content_length = 6;
  // See IngestDocumentRequest.display_path.
  string display_path = 7;
}

message IngestBatchEndDocument {}

message IngestBatchResponse {
  // Exactly one result per document header, in request order.
  repeated IngestBatchDocumentResult documents = 1;
}

message IngestBatchDocumentResult {
  string document_id = 1;
  oneof outcome {
    IngestBatchDocumentSuccess success = 2;
    IngestBatchDocumentFailure failure = 3;
  }
}

message IngestBatchDocumentSuccess {
  uint32 chunk_count = 1;
}

message IngestBatchDocumentFailure {
  IngestBatchFailureStage stage = 1;
  string message = 2;
}

enum IngestBatchFailureStage {
  INGEST_BATCH_FAILURE_STAGE_UNSPECIFIED = 0;
  INGEST_BATCH_FAILURE_STAGE_PARSE = 1;
  INGEST_BATCH_FAILURE_STAGE_RESOURCE_LIMIT = 2;
  INGEST_BATCH_FAILURE_STAGE_STORE = 3;
}

message DeleteDocumentRequest {
  string document_id = 1;
  reserved 2; // chunk_count, replaced by a filtered delete on document_id (#3)
  reserved "chunk_count";
}

message DeleteDocumentResponse {}

message SearchRequest {
  // Natural-language query. Embedded with the same model as passages.
  string query = 1;
  // Maximum number of chunks to return.
  uint32 limit = 2;
  // Optional: restrict results to one source (empty means all sources).
  string source_id = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

// SearchResult is one matching chunk. Fields mirror what was provided
// at ingest time (stored in the vector point's payload).
message SearchResult {
  string document_id = 1;
  string source_id = 2;
  string uri = 3;
  uint32 chunk_index = 4;
  // Cosine similarity score in [0, 1]; higher is more similar.
  float score = 5;
  // The chunk text itself, so callers can show a snippet without
  // re-reading the original file.
  string text = 6;
  // Inclusive 1-based line range in the original document. Zero means
  // unknown (for example, a result ingested by an older worker).
  uint32 start_line = 7;
  uint32 end_line = 8;
}
