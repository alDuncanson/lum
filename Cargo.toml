# lum — local semantic code search.
#
# One binary: the daemon, the CLI, the MCP server, and the TUI, depending on
# the subcommand.

[package]
name = "lum"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Local semantic code search with a Neovim picker"
repository = "https://github.com/alDuncanson/lum"

[[bin]]
name = "lum"
path = "src/main.rs"

# This package is the whole workspace.
[workspace]

[dependencies]
# --- async runtime and the one socket ---
# The daemon is I/O-bound on the socket and CPU-bound on inference. Inference
# runs on spawn_blocking; everything else is a handful of tasks.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "io-std",
  "sync",
  "time",
  "signal",
  "process",
  "fs",
] }

# --- wire format ---
# Newline-delimited JSON over a Unix socket. Chosen because the two clients
# that matter can already speak it with nothing added: Neovim has vim.json
# and vim.uv, and a shell has jq and socat.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- inference ---
# ort drives ONNX Runtime directly: it is what allows separate query and
# ingest sessions, so a query never waits behind an ingest batch, and it
# exposes the allocator knobs that keep the arena from growing to gigabytes.
ort = { version = "2.0.0-rc.10", default-features = false, features = [
  "std",
  "ndarray",
  "tracing",
] }
ndarray = "0.16"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# Model download on first run, into HuggingFace's standard cache layout, so
# an existing ~/.lum/models is reused rather than re-downloaded.
hf-hub = { version = "0.4", default-features = false, features = [
  "ureq",
  "rustls-tls",
] }

# --- storage ---
# One SQLite file holds sources, documents, chunks, and vectors. Bundled so
# `cargo build` needs no system sqlite, and so there is exactly one file to
# back up, copy, or delete.
rusqlite = { version = "0.32", features = ["bundled"] }

# --- chunking ---
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-nix = "0.3"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5.3"

# --- filesystem ---
# The `ignore` crate is ripgrep's walker: gitignore semantics at every
# directory level, including nested files and negations, already correct and
# already fast.
ignore = "0.4"
notify = "8"
blake3 = "1"
dirs = "6"

# --- interface ---
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

# --- utilities ---
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["vendored-onnxruntime"]

# Let `ort` fetch and link its own ONNX Runtime build.
#
# On by default, because it is what makes `cargo build` work with no system
# dependency and what a release binary needs to run anywhere. Off for the Nix
# build, which links nixpkgs' copy through ORT_LIB_LOCATION — and whose sandbox
# has no network to download with regardless.
#
# Worth a feature rather than a build-time environment variable because of what
# it drags in: the downloader is `ureq` with `native-tls`, which on macOS is
# Security.framework but on Linux is `openssl-sys`, `pkg-config`, and
# `libssl-dev`. That is an entire TLS stack compiled into the *build* graph to
# fetch one file, and it is why a sandboxed Linux build fails without this
# feature turned off.
vendored-onnxruntime = ["ort/download-binaries", "ort/copy-dylibs"]

# Only for the page size behind /proc/self/statm; macOS talks to mach directly.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# ONNX Runtime is the bulk of the binary; thin LTO keeps it lean without
# making a release build take all afternoon.
lto = "thin"
codegen-units = 1
strip = "symbols"
