# Retrieval fixture: search phrases with the files they should surface.
#
# Run with `nix run .#eval` (see eval/README.md).
#
# These are phrases, not questions, because lum is a bi-encoder: it embeds
# your text and returns the nearest chunks by cosine similarity. There is no
# model reading a sentence and reasoning about it, so "how does lum avoid
# keeping the model in memory when nobody is searching?" is not a realistic
# input — that is a question for a chatbot. What people type into a search
# box is two to four words describing the thing they want, usually because
# they do not know where it lives.
#
# Rules that keep this honest:
#
#   - Write what you would type, and stop. "idle shedding", not "where is
#     idle shedding implemented and why".
#   - Prefer phrases for things you would not know how to grep for. Where the
#     exact words already appear in the code, grep wins and this measures
#     nothing interesting.
#   - `files` lists every file that would be a correct top hit. Padding it
#     inflates recall without improving anything.
#   - `contains` is optional: a substring the matched chunk must include. It
#     measures what recall cannot — whether you got the right *part* of the
#     right file. Use an identifier, not a line number: line numbers drift
#     with every edit above them and rot into permanent misses.
#
# Adding a query is a real edit to the benchmark. Do it when you find
# something lum should surface and does not, before changing anything.
#
# Rewritten alongside the single-process rewrite. Every path here changed, so
# the numbers are not comparable with runs from before it — a fixture pointing
# at deleted files measures nothing but its own staleness.

queries:
  # --- documentation and prose ---
  # Path-flavored: the words are in the filename as much as the content. The
  # display path is embedded with every chunk (see embed::passage_text), so
  # these measure that as much as they measure the prose.
  - query: ingestion diagram
    files: [docs/diagrams.md]
    contains: Ingestion data flow

  - query: architecture overview
    files: [docs/architecture.md, README.md]

  - query: protocol boundaries table
    files: [docs/diagrams.md]

  - query: readme install instructions
    files: [README.md]

  # --- Neovim plugin ---
  - query: telescope plugin setup
    files: [lua/lum/telescope.lua]
    contains: M.setup

  - query: neovim notifications
    files: [lua/lum/notify.lua]

  - query: picker entry formatting
    files: [lua/lum/telescope.lua]
    contains: make_entry

  - query: editor socket client
    files: [lua/lum/client.lua]

  - query: lsp progress reporting
    files: [lua/lum/lsp.lua, lua/lum/progress.lua]

  # --- scanning and file selection ---
  - query: indexable file extensions
    files: [src/mime.rs]
    contains: EXTENSIONS

  - query: parsed files
    files: [src/mime.rs, src/parse.rs]

  - query: gitignore rules
    files: [src/scan.rs]

  - query: excluded directories
    files: [src/config.rs, src/scan.rs]
    contains: DEFAULT_EXCLUDE_DIRS

  - query: file watcher
    files: [src/watch.rs]

  - query: change detection fingerprint
    files: [src/scan.rs]
    contains: fingerprint

  - query: racily clean file
    files: [src/scan.rs]
    contains: RACE_WINDOW

  # --- ingest pipeline ---
  - query: scan planner
    files: [src/engine.rs]
    contains: run_scan

  - query: retry backoff
    files: [src/engine.rs]
    contains: schedule_retry

  - query: batching documents for inference
    files: [src/engine.rs, src/embed.rs]

  - query: document identity
    files: [src/db.rs]

  - query: sqlite schema
    files: [src/db.rs]
    contains: CREATE TABLE

  - query: index model identity check
    files: [src/db.rs]
    contains: check_identity

  # --- embedding and retrieval ---
  - query: embedding model
    files: [src/embed.rs]

  - query: token budget batching
    files: [src/embed.rs]
    contains: TOKEN_BUDGET

  - query: cls pooling and normalization
    files: [src/embed.rs]
    contains: normalize

  - query: chunk overlap
    files: [src/chunk/word_window.rs]
    contains: WordWindowChunker

  - query: syntax aware chunking
    files: [src/chunk/syntax.rs]

  - query: heading trail context
    files: [src/chunk/syntax.rs]
    contains: HeadingTrail

  - query: markdown front matter
    files: [src/parse.rs]
    contains: strip_front_matter

  - query: vector store upsert
    files: [src/db.rs]
    contains: upsert_document

  - query: cosine similarity search
    files: [src/index.rs]

  - query: int8 quantization
    files: [src/index.rs]
    contains: quantize

  - query: collapse results per file
    files: [src/engine.rs]
    contains: per_file

  # --- process lifecycle ---
  - query: idle shedding
    files: [src/embed.rs, src/server.rs]
    contains: release_ingest

  - query: graceful shutdown
    files: [src/server.rs]

  - query: daemon lock file
    files: [src/client.rs, src/server.rs]

  - query: daemon failed to start
    files: [src/client.rs]

  - query: spawn child process
    files: [src/client.rs]
    contains: spawn_daemon

  # --- interfaces ---
  - query: wire protocol framing
    files: [src/wire.rs]

  - query: event subscription stream
    files: [src/server.rs, src/events.rs]

  - query: mcp tools
    files: [src/mcp.rs]

  - query: cli commands
    files: [src/cli.rs]

  - query: live activity tui
    files: [src/top.rs]

  - query: progress spinner
    files: [src/render.rs]

  # --- configuration and build ---
  - query: environment variables
    files: [src/config.rs]

  - query: unix socket path
    files: [src/config.rs, src/server.rs]

  - query: resident memory reporting
    files: [src/sys.rs]

  - query: nix flake outputs
    files: [flake.nix]

  - query: development shell
    files: [flake.nix]

  # --- looking for the tests, not the implementation ---
  #
  # These exist to keep the fixture honest about a change worth considering:
  # down-weighting test files, because they outrank implementations for
  # several queries above. Without a query whose answer *is* a test, that
  # change can only ever look free, and the benchmark would be measuring its
  # own bias rather than lum.
  #
  # Rust puts tests in the same file as the code they exercise, so these no
  # longer discriminate by path at all — they ask for a specific part of a
  # file that also contains the implementation. That makes them a sharper
  # measure of `contains` than they were, and it is why `exclude_tests`
  # deliberately has no rule for Rust source.
  - query: test that a shrunk document leaves no stale vectors
    files: [src/db.rs]
    contains: a_shrinking_reingest_leaves_no_stale_tail

  - query: test that deleting a source removes its vectors
    files: [src/db.rs]
    contains: deleting_a_source_takes_its_chunks_and_vectors_with_it

  - query: test that reindexing does not leak rows
    files: [src/index.rs]
    contains: replacing_a_document_reuses_its_rows_instead_of_growing

  - query: ingest failure attempts test
    files: [src/db.rs]
    contains: failures_count_attempts_and_clear_on_success

  - query: model mismatch refused test
    files: [src/db.rs]
    contains: a_mismatched_model_is_refused_rather_than_mixed
