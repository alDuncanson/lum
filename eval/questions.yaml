# Retrieval fixture: questions with known-correct answers, asked against
# this repository.
#
# This exists so changes to parsing, chunking, and embedding can be judged
# by a number instead of by whether the results feel better to the person
# who just changed them. Run it with `nix run .#eval` (see eval/README.md).
#
# Rules that keep it honest:
#
#   - Ask what you would actually ask, not a description of code you are
#     looking at. "where are retries handled" is a question; "the
#     replaceRetry function in ingest.go" is a lookup, and grep already
#     wins those.
#   - Prefer questions whose answer words do NOT appear in the answer. That
#     is the only place semantic search can beat a regex, and the place
#     prose-shaped chunking hurts most.
#   - `files` lists every file that would be a correct top hit. Keep it to
#     what genuinely answers the question — padding it inflates recall.
#   - `contains` is optional: a substring the matched chunk must include.
#     It measures what recall cannot — whether you got the right *part* of
#     the right file. A substring rather than a line range on purpose, since
#     line numbers drift with every edit above them and a rotted answer key
#     scores as a permanent miss. Use an identifier that will not move.
#
# Adding a question is a real edit to the benchmark. Do it when you find a
# query lum should handle and does not, before changing anything to fix it.

questions:
  # --- lifecycle and process management ---
  - q: how does lum avoid keeping the embedding model in memory when nobody is searching?
    files: [dispatcher/internal/worker/manager.go]
    contains: shedIfIdle

  - q: what stops two commands from starting duplicate background processes at the same time?
    files: [dispatcher/internal/apiclient/daemon.go]

  - q: how do we know the previous instance has completely finished shutting down?
    files: [dispatcher/internal/apiclient/client.go]

  - q: why does killing the child process gracefully matter here?
    files: [dispatcher/internal/worker/supervisor.go]

  - q: how does the child process notice its parent disappeared?
    files: [worker/src/main.rs, dispatcher/internal/worker/supervisor.go]

  # --- change detection and ingestion ---
  - q: how does lum decide a file does not need to be re-read?
    files: [dispatcher/internal/source/localdir.go, dispatcher/internal/ingest/ingest.go]

  - q: what prevents a branch switch from re-embedding the whole repository?
    files: [dispatcher/internal/ingest/ingest.go]
    contains: refreshFingerprint

  - q: why might a recently edited file be treated differently from an old one?
    files: [dispatcher/internal/source/localdir.go]
    contains: fingerprintRaceWindow

  - q: how are dependency and build directories kept out of the index?
    files: [dispatcher/internal/source/localdir.go]
    contains: defaultExcludedDirectories

  - q: what happens to a document that fails to index, and how many times is it tried?
    files: [dispatcher/internal/ingest/ingest.go]

  - q: how are many small files sent to the worker efficiently?
    files: [dispatcher/internal/ingest/ingest.go, dispatcher/internal/worker/client.go]

  - q: what guarantees vectors are on disk before we record that a document was indexed?
    files: [worker/src/store/edge.rs]

  - q: how does a shrinking file avoid leaving stale entries behind?
    files: [worker/src/store/edge.rs, worker/src/service.rs]

  # --- search path ---
  - q: where does the text of a query get turned into numbers?
    files: [worker/src/pipeline/embedder.rs]

  - q: why are queries and documents embedded differently?
    files: [worker/src/pipeline/embedder.rs]
    contains: embed_query

  - q: how are results limited to a single repository?
    files: [worker/src/store/edge.rs, dispatcher/internal/api/server.go]

  - q: how does a search result know which lines of the file it came from?
    files: [worker/src/pipeline/chunker.rs, worker/src/store/edge.rs]

  - q: how is a document split up before being indexed?
    files: [worker/src/pipeline/chunker.rs]
    contains: WordWindowChunker

  # --- interfaces ---
  - q: how does the editor integration talk to lum?
    files: [lua/lum/telescope.lua]

  - q: how do I make the editor show me what is happening during indexing?
    files: [lua/lum/notify.lua]

  - q: what tools does an AI agent get?
    files: [dispatcher/internal/mcpserver/server.go]

  - q: how can another program watch indexing progress?
    files: [dispatcher/internal/api/server.go, dispatcher/internal/cli/events.go]

  - q: where are the HTTP endpoints defined?
    files: [dispatcher/internal/api/server.go]

  # --- storage and identity ---
  - q: what does lum remember about a file between runs?
    files: [dispatcher/internal/catalog/catalog.go]

  - q: how does re-indexing the same file avoid creating duplicate entries?
    files: [worker/src/store/edge.rs]
    contains: point_uuid

  - q: what happens to the index when the embedding model changes?
    files: [worker/src/store/edge.rs]
    contains: validate_manifest

  - q: why is a file path alone not enough to identify a document?
    files: [dispatcher/internal/catalog/catalog.go]

  # --- configuration and failure modes ---
  - q: what settings can be changed with environment variables?
    files: [dispatcher/internal/config/config.go]

  - q: why would lum refuse to start because of where its data lives?
    files: [dispatcher/internal/config/config.go]
    contains: validateSocketPath

  - q: how do the two processes find each other?
    files: [dispatcher/internal/worker/client.go, dispatcher/internal/config/config.go]
